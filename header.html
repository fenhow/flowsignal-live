html,body{height:100%;overflow:hidden;font-family:Inter,"Avenir Next","Segoe UI",Arial,sans-serif}
.b{position:relative;height:100vh;width:100vw;display:flex;align-items:center;background:linear-gradient(100deg,#fff 0%,#fff 40%,#EAF5FC 62%,#DCEFFA 100%);overflow:hidden;--h:100vh}

.div{position:relative;flex:none;width:1.5px;height:64%;margin:0 calc(var(--h)*.3);background:linear-gradient(#fff,#9FB3C8,#fff)}
.px{position:relative;flex:none}
.px .top{display:flex;align-items:center;gap:calc(var(--h)*.16)}
.px img{height:calc(var(--h)*.38);display:block}
.px .a{font-size:calc(var(--h)*.09);font-weight:600;letter-spacing:.27em;color:#002145;white-space:nowrap}
